name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobaciones del sitio generado
        run: python3 -m unittest discover -s _tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright y Chromium (fuera del sitio)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Pruebas en el navegador
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node --test _tests/browser.test.js
