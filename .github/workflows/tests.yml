name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Solo lectura: las pruebas no necesitan escribir en el repositorio.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Acciones fijadas por el hash del commit (la etiqueta va en el comentario).
      # Dependabot (.github/dependabot.yml) propone las actualizaciones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Comprobaciones del sitio generado
        run: python3 -m unittest discover -s _tests -v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Instalar Playwright y Chromium (fuera del sitio)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Pruebas en el navegador
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node --test _tests/browser.test.js
