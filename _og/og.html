<!DOCTYPE html>
<!-- Plantilla de la imagen para compartir en redes (og-image.jpg, 1200 × 630).
     No se publica (la carpeta empieza por «_»). Para regenerarla:
     node _og/make.js   (necesita Playwright) -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; font-weight: 300 700; src: url("../fonts/inter-latin.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 200 800; src: url("../fonts/manrope-latin.woff2") format("woff2"); }
html, body { margin: 0; }
.card {
    position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    display: flex; align-items: center; gap: 80px; padding: 0 120px;
    background:
        radial-gradient(60% 70% at 22% 50%, rgba(46, 196, 166, 0.22), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(15, 42, 68, 0.04) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgba(15, 42, 68, 0.04) 39px 40px),
        linear-gradient(160deg, #ffffff 0%, #f3f7fb 55%, #e3ecf5 100%);
    font-family: "Inter", sans-serif; color: #0b1726;
}
.card::after { content: ""; position: absolute; inset: 24px; border: 1px solid rgba(15, 42, 68, 0.18); border-radius: 28px; }
.logo { width: 151px; height: auto; filter: drop-shadow(0 0 40px rgba(46, 196, 166, 0.45)); }
.name { margin: 0; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 74px; line-height: 1; white-space: nowrap; letter-spacing: -0.03em; color: #13a98d; }
.name span { color: #0f2a44; }
.rule { width: 120px; height: 4px; margin: 34px 0 30px; border-radius: 2px; background: linear-gradient(120deg, #6be6cd 0%, #2ec4a6 50%, #0f2a44 100%); }
.tagline { margin: 0; font-family: "Manrope", sans-serif; font-weight: 600; font-size: 38px; line-height: 1.3; letter-spacing: -0.02em; color: #1f2d3d; }
</style>
</head>
<body>
<div class="card">
    <img class="logo" src="../logo-icon-dark.png" alt="">
    <div>
        <p class="name">Twins <span>Real Estate</span></p>
        <div class="rule"></div>
        <p class="tagline">Compraventa · Alquiler · Valoración</p>
    </div>
</div>
</body>
</html>
